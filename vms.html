<!DOCTYPE html>
<html>
<head>
    <title>Ketchup VMs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Droid+Sans" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs@3.15.2/crouton.min.css" />
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #2c2c2c;
            color: #cfcfcf;
            font-family: "Droid Sans", sans-serif;
        }
        #status-line {
            padding: 14px 16px 12px;
            background: #333;
            border-bottom: 3px solid lightseagreen;
        }
        #status-line strong {
            color: #f2f2f2;
            font-weight: 700;
        }
        #load-status {
            margin-top: 4px;
            color: #8fbcb8;
            font-size: 13px;
            line-height: 1.4;
        }
        #loading {
            padding: 16px;
        }
        #bmlt-tabs .bmlt-column1 {
            min-width: 10.5rem;
            word-break: normal;
            overflow-wrap: anywhere;
        }
        #bmlt-tabs .bmlt-time,
        #bmlt-tabs .bmlt-time-2 {
            color: #f3f3f3;
            line-height: 1.25;
        }
        #bmlt-tabs .converted-time {
            font-variant-numeric: tabular-nums;
        }
        #bmlt-tabs .original-time {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: baseline;
            gap: 1px 8px;
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid rgba(32, 178, 170, 0.4);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.35;
            font-variant-numeric: tabular-nums;
        }
        #bmlt-tabs .orig-clock {
            color: #b7e6e1;
        }
        #bmlt-tabs .orig-abbr {
            color: lightseagreen;
            font-size: 11px;
            letter-spacing: 0.03em;
        }
        #bmlt-tabs .orig-zone,
        #bmlt-tabs .orig-note {
            grid-column: 1 / -1;
        }
        #bmlt-tabs .orig-zone {
            color: #b4b4b4;
            font-size: 11px;
        }
        #bmlt-tabs .orig-note {
            color: #808080;
            font-size: 10px;
        }
        @media (max-width: 640px) {
            #bmlt-tabs .bmlt-column1 {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
<div id="status-line">
    <div><strong id="meeting-count">…</strong> virtual meetings worldwide</div>
    <div id="load-status">Loading virtual meetings…</div>
</div>
<div id="loading"><img src="resources/loading.gif" alt="Loading"></div>
<div id="bmlt-tabs"></div>
<script src="https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs@3.15.2/crouton.min.js"></script>
<script type="text/javascript">
(function () {
    var ROOT = "https://aggregator.bmltenabled.org/main_server";
    var CACHE_DB = "ketchup-vms";
    var CACHE_STORE = "payloads";
    var CACHE_KEY = "virtual-meetings";
    var CACHE_TTL_MS = 4 * 60 * 60 * 1000;
    var LOCAL_TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC";
    var LOCAL_TZ_LABEL = LOCAL_TZ.split("/").pop().replace(/_/g, " ");
    var MEETING_FIELDS = [
        "id_bigint", "meeting_name", "weekday_tinyint", "start_time", "duration_time",
        "time_zone", "latitude", "longitude", "formats", "format_shared_id_list",
        "venue_type", "location_municipality", "location_province", "location_nation",
        "location_street", "location_text", "location_info", "location_neighborhood",
        "location_sub_province", "location_postal_code_1", "virtual_meeting_link",
        "virtual_meeting_additional_info", "phone_meeting_number", "comments",
        "service_body_bigint", "root_server_uri", "worldid_mixed"
    ].join(",");

    function setStatus(message) {
        var el = document.getElementById("load-status");
        if (el) el.textContent = message;
    }

    function jsonpResponse(payload) {
        return {
            ok: true,
            json: function () { return Promise.resolve(payload); }
        };
    }

    function openCache() {
        return new Promise(function (resolve, reject) {
            if (!window.indexedDB) {
                resolve(null);
                return;
            }
            var req = indexedDB.open(CACHE_DB, 1);
            req.onupgradeneeded = function () {
                req.result.createObjectStore(CACHE_STORE);
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { resolve(null); };
        });
    }

    function readCache() {
        return openCache().then(function (db) {
            if (!db) return null;
            return new Promise(function (resolve) {
                var tx = db.transaction(CACHE_STORE, "readonly");
                var req = tx.objectStore(CACHE_STORE).get(CACHE_KEY);
                req.onsuccess = function () { resolve(req.result || null); };
                req.onerror = function () { resolve(null); };
            });
        });
    }

    function writeCache(payload) {
        var record = {
            savedAt: Date.now(),
            meetings: payload.meetings,
            formats: payload.formats
        };
        return openCache().then(function (db) {
            if (!db) return;
            return new Promise(function (resolve) {
                var tx = db.transaction(CACHE_STORE, "readwrite");
                tx.objectStore(CACHE_STORE).put(record, CACHE_KEY);
                tx.oncomplete = function () { resolve(); };
                tx.onerror = function () { resolve(); };
            });
        });
    }

    function fillTimeZone(meeting) {
        if (!meeting.listed_time_zone) {
            meeting.listed_time_zone = (meeting.time_zone || "").trim();
        }
        if (meeting.listed_time_zone) {
            meeting.time_zone = meeting.listed_time_zone;
            meeting.time_zone_source = "listed";
            return;
        }
        var lat = parseFloat(meeting.latitude);
        var lng = parseFloat(meeting.longitude);
        if (lat && lng && !(lat === 0 && lng === 0) && typeof tzlookup === "function") {
            try {
                meeting.time_zone = tzlookup(lat, lng);
                meeting.time_zone_source = "coords";
                return;
            } catch (err) {}
        }
        // Keep the listed clock time as-is when the meeting has no zone or coords.
        meeting.time_zone = LOCAL_TZ;
        meeting.time_zone_source = "local";
    }

    function formatListedTime(startTime) {
        var fmt = (window.crouton && crouton.config && crouton.config.time_format) || "h:mm a";
        if (typeof moment !== "function") return startTime;
        var parsed = moment(startTime, ["HH:mm:ss", "HH:mm"], true);
        return parsed.isValid() ? parsed.format(fmt) : startTime;
    }

    function zoneAbbreviation(zone, startTime) {
        if (!zone || typeof moment !== "function" || !moment.tz) return "";
        try {
            var zoned = moment.tz(startTime, ["HH:mm:ss", "HH:mm"], zone);
            if (!zoned.isValid()) return "";
            var abbr = zoned.format("z");
            if (!abbr || abbr === zone || abbr.indexOf("+") === 0 || abbr.indexOf("-") === 0) return "";
            return abbr;
        } catch (err) {
            return "";
        }
    }

    function friendlyZoneName(zone) {
        if (!zone) return "";
        var parts = zone.split("/");
        return parts[parts.length - 1].replace(/_/g, " ");
    }

    function attachOriginalTimes(meetings) {
        (meetings || []).forEach(function (meeting) {
            var origDay = meeting.weekday_tinyint && crouton.localization
                ? crouton.localization.getDayOfTheWeekWord(parseInt(meeting.weekday_tinyint, 10))
                : "";
            meeting.original_clock = formatListedTime(meeting.start_time);
            meeting.original_zone_id = meeting.time_zone || "";
            meeting.original_zone_name = friendlyZoneName(meeting.time_zone) || "Unknown zone";
            meeting.original_zone_abbr = zoneAbbreviation(meeting.time_zone, meeting.start_time);
            meeting.original_day = (origDay && meeting.formatted_day && origDay !== meeting.formatted_day) ? origDay : "";
            meeting.original_note = meeting.time_zone_source === "coords"
                ? "Zone inferred from location"
                : (meeting.time_zone_source === "local" ? "No zone provided; shown as listed" : "");
            meeting.original_time_line = [
                meeting.original_clock,
                meeting.original_zone_id,
                meeting.original_zone_abbr,
                meeting.original_day,
                meeting.original_note
            ].filter(Boolean).join(" · ");
        });
        return meetings;
    }

    function addTimePart(parent, className, text) {
        if (!text) return;
        var el = document.createElement("span");
        el.className = className;
        el.textContent = text;
        parent.appendChild(el);
    }

    function wrapConvertedTime(timeEl) {
        if (timeEl.querySelector(".converted-time")) return;
        var converted = document.createElement("div");
        converted.className = "converted-time";
        var node = timeEl.firstChild;
        while (node) {
            var next = node.nextSibling;
            if (node.nodeType === 3) {
                converted.appendChild(node);
            }
            node = next;
        }
        converted.textContent = converted.textContent.replace(/\s+/g, " ").trim();
        timeEl.insertBefore(converted, timeEl.firstChild);
    }

    function annotateTimesInTable() {
        var byId = {};
        (crouton.meetingData || []).forEach(function (meeting) {
            byId[String(meeting.id_bigint)] = meeting;
            if (meeting.membersOfGroup) {
                meeting.membersOfGroup.forEach(function (member) {
                    byId[String(member.id_bigint)] = member;
                });
            }
        });
        document.querySelectorAll(".bmlt-data-row").forEach(function (row) {
            var id = (row.getAttribute("data-id") || row.id || "").replace("meeting-data-row-", "");
            var meeting = byId[id];
            if (!meeting || !meeting.original_clock) return;
            var timeEl = row.querySelector(".bmlt-time-2, .bmlt-time");
            if (!timeEl || timeEl.querySelector(".original-time")) return;
            wrapConvertedTime(timeEl);
            var orig = document.createElement("div");
            orig.className = "original-time";
            orig.title = meeting.original_time_line;
            addTimePart(orig, "orig-clock", meeting.original_day
                ? meeting.original_day + " " + meeting.original_clock
                : meeting.original_clock);
            addTimePart(orig, "orig-abbr", meeting.original_zone_abbr);
            addTimePart(orig, "orig-zone", meeting.original_zone_name);
            addTimePart(orig, "orig-note", meeting.original_note);
            timeEl.appendChild(orig);
        });
    }

    function uniqueBy(list, keyFn) {
        var seen = {};
        var out = [];
        (list || []).forEach(function (item) {
            var key = keyFn(item);
            if (!seen[key]) {
                seen[key] = true;
                out.push(item);
            }
        });
        return out;
    }

    function fetchDay(weekday) {
        var url = ROOT + "/client_interface/json/?switcher=GetSearchResults"
            + "&get_used_formats"
            + "&venue_types[]=2"
            + "&weekdays[]=" + weekday
            + "&page_size=5000"
            + "&data_field_key=" + encodeURIComponent(MEETING_FIELDS);
        return fetch(url).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status + " for weekday " + weekday);
            return res.json();
        });
    }

    function fetchAllVirtualMeetings() {
        setStatus("Fetching meetings by day from BMLT (free, no timezone API)…");
        var days = [1, 2, 3, 4, 5, 6, 7];
        return Promise.all(days.map(fetchDay)).then(function (chunks) {
            var meetings = [];
            var formats = [];
            chunks.forEach(function (chunk) {
                var dayMeetings = Array.isArray(chunk) ? chunk : (chunk.meetings || []);
                var dayFormats = Array.isArray(chunk) ? [] : (chunk.formats || []);
                meetings = meetings.concat(dayMeetings);
                formats = formats.concat(dayFormats);
            });
            meetings = uniqueBy(meetings, function (m) { return String(m.id_bigint); });
            formats = uniqueBy(formats, function (f) {
                return (f.root_server_uri || "") + "|" + (f.id || f.key_string);
            });
            meetings.forEach(fillTimeZone);
            if (!meetings.length) throw new Error("No virtual meetings returned");
            return { meetings: meetings, formats: formats };
        });
    }

    function loadVirtualMeetings(fallbackUrl) {
        return readCache().then(function (cached) {
            var fresh = cached && (Date.now() - cached.savedAt) < CACHE_TTL_MS;
            if (fresh) {
                (cached.meetings || []).forEach(fillTimeZone);
                setStatus("Times in " + LOCAL_TZ_LABEL + ". Original meeting time and zone sit under each clock. Cached list, refreshed every 4 hours.");
                return { meetings: cached.meetings, formats: cached.formats };
            }
            return fetchAllVirtualMeetings().then(function (payload) {
                writeCache(payload);
                setStatus("Times in " + LOCAL_TZ_LABEL + ". Original meeting time and zone sit under each clock.");
                return payload;
            }).catch(function (err) {
                console.warn("Parallel virtual meeting fetch failed", err);
                if (cached && cached.meetings && cached.meetings.length) {
                    (cached.meetings || []).forEach(fillTimeZone);
                    setStatus("Times in " + LOCAL_TZ_LABEL + ". Showing a cached list after a live fetch error.");
                    return { meetings: cached.meetings, formats: cached.formats };
                }
                setStatus("Falling back to a full aggregator query…");
                return origFetchJsonp(fallbackUrl).then(function (res) { return res.json(); });
            });
        }).then(function (payload) {
            if (payload && payload.meetings) payload.meetings.forEach(fillTimeZone);
            return jsonpResponse(payload);
        });
    }

    var origFetchJsonp = typeof fetchJsonp === "function" ? fetchJsonp : null;
    if (origFetchJsonp) {
        window.fetchJsonp = function (url, opts) {
            if (String(url).indexOf("switcher=GetSearchResults") !== -1) {
                return loadVirtualMeetings(url);
            }
            return origFetchJsonp(url, opts);
        };
    } else {
        setStatus("Times in " + LOCAL_TZ_LABEL + ". Original meeting time and zone sit under each clock.");
    }

    // Crouton templates and helpers look up the global `crouton` instance.
    var crouton = window.crouton = new Crouton({
        root_server: ROOT,
        // page_size is an aggregator-legal filter so we can skip the worldwide service-body scan.
        custom_query: "&venue_types[]=2&page_size=20000",
        auto_tz_adjust: true,
        theme: "frog",
        template_path: "https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs@3.15.2/templates",
        has_venues: false,
        has_locations: false,
        has_cities: false,
        has_zip_codes: false,
        has_groups: true,
        has_regions: true,
        has_areas: true,
        button_filters: [],
        on_complete: function () {
            $("#loading").hide();
            annotateTimesInTable();
        }
    });
    var origEnrich = crouton.enrichMeetings.bind(crouton);
    crouton.enrichMeetings = function (meetingData) {
        return attachOriginalTimes(origEnrich(meetingData));
    };
    crouton.render();
    crouton.meetingCount(function (res) {
        document.getElementById("meeting-count").textContent = res;
    });
})();
</script>
</body>
</html>
